# Workflow: compile the playground project for pull requests and manual runs.
# It uses the local charts checkout to build against the shared charts repo.
#
# This is the lighter build check before tests.
name: Compile
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout charts
        uses: actions/checkout@v7
        with:
          repository: HDCharts/charts
          path: charts
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Compile
        run: ./gradlew -DchartsLocalPath=charts ciCompile

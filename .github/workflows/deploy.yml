# Deploys the snapshot playground whenever main changes. The build and publication run
# in HDCharts/charts (Publish Playground), which owns the AWS credentials and publish
# scripts; this workflow only dispatches it. Charts always builds the current playground
# main, so skipped, cancelled, or reordered dispatches can never publish a stale revision.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Dispatch playground publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] || [[ -z "${BEFORE_SHA}" ]] || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            should_run=true
          else
            should_run="$(bash scripts/ci-has-code-changes.sh "$BEFORE_SHA" "$GITHUB_SHA")"
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Dispatch Publish Playground in charts
        if: steps.changes.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHARTS_WORKFLOW_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing CHARTS_WORKFLOW_TOKEN. It must be a release-bot token with actions:write access to HDCharts/charts." >&2
            exit 1
          fi
          gh workflow run publish-playground.yml \
            --repo HDCharts/charts \
            --ref main \
            -f reason="charts-playground ${GITHUB_SHA::7}"
          echo "Dispatched: https://github.com/HDCharts/charts/actions/workflows/publish-playground.yml"

      - name: Skip deploy for docs-only changes
        if: steps.changes.outputs.should_run != 'true'
        run: echo "No code/build changes detected. Skipping deploy."
